apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-submitter
  namespace: jobs
  annotations:
    # Strip the path prefix before forwarding to the backend.
    # Without this, /submit goes to the pod as /submit — which is correct.
    # Added explicitly so nginx doesn't rewrite to /.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: jobs.local
      http:
        paths:
          # Match /submit and /submit/... — the rewrite-target /$2 preserves
          # everything after the prefix (empty for /submit, so pod receives /submit).
          - path: /submit(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080

          - path: /status(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080

          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080
