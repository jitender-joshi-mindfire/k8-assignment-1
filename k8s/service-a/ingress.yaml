apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-submitter
  namespace: jobs
  annotations:
    # Simple prefix rewrite: strip the matched prefix and pass the rest.
    # /submit   → pod receives /submit
    # /status/… → pod receives /status/…
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: jobs.local
      http:
        paths:
          - path: /submit
            pathType: Prefix
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080

          - path: /status
            pathType: Prefix
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080

          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: job-submitter
                port:
                  number: 8080
