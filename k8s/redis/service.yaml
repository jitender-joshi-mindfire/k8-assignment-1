apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jobs
  labels:
    app: redis
spec:
  # ClusterIP means Redis is only reachable from within the cluster.
  # Services A, B, and C all connect via REDIS_ADDR=redis:6379.
  # Kubernetes DNS resolves "redis" → this ClusterIP automatically
  # because all four resources are in the same namespace (jobs).
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
